; -----------------------------------
; Configure Application
; -----------------------------------
[app]
APP_NAME           = 'Ozz Framework'
APP_VERSION        = '1.0'
APP_ENV            = 'local'
APP_LANG           = 'en'
APP_URLS           = '127.0.0.1:4000'
DEBUG              = true
SHOW_DEBUG_BAR     = true
DEBUG_EMAIL        = true
ENABLE_CMS         = true
USE_CSP            = false
PRIMARY_DB         = 'primary_db'

[app_log]
DB_NAME            = 'storage/log.sqlite3'

; -----------------------------------
; DB Settings
; -----------------------------------
[primary_db]
DB_TYPE            = 'mysql'
DB_HOST            = 'localhost'
DB_PORT            = 3306
DB_USERNAME        = ''
DB_PASSWORD        = ''
DB_NAME            = ''
DB_PREFIX          = ''
DB_CHARSET         = 'utf8mb4'
DB_COLLATION       = 'utf8mb4_unicode_ci'
DB_OPTIONS[ATTR_CASE]       = "CASE_NATURAL"
DB_OPTIONS[ATTR_ERRMODE]    = "ERRMODE_EXCEPTION"
DB_OPTIONS[ATTR_PERSISTENT] = false
DB_COMMANDS[] = "SET SQL_MODE=ANSI_QUOTES"
DB_COMMANDS[] = "SET time_zone = '+00:00'"

; -----------------------------------
; SMTP Email Settings
; -----------------------------------
[sMTP]
MAIL_FROM_ADDRESS  = 'example@mail.com'
MAIL_FROM_NAME     = 'App Name'
IS_SMTP            = false
SMTP_HOST          = ''
SMTP_PORT          = 0
SECURE             = 'ssl'
SMTP_USERNAME      = ''
SMTP_PASSWORD      = ''

; -----------------------------------
; CMS Settings
; -----------------------------------
[cms]
ADMIN_PATH        = '/admin'
